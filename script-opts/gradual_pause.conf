# Configuration file for mpv-gradual-pause script
# Place this file in ~/.config/mpv/script-opts/gradual_pause.conf

# Duration of the fade-out while pausing, in seconds.
# Playback keeps running during this ramp, then pauses on the later frame.
# Valid range: 0.0 - 5.0
# Default: 0.45
fade_out_duration=0.45

# Duration of the fade-in while unpausing, in seconds.
# Valid range: 0.0 - 5.0
# Default: 0.45
fade_in_duration=0.45

# Legacy smoothness hint. The ramp is sampled on a timer and is never coarser
# than 20ms, so a low step count cannot zipper. Higher values (up to 100)
# sample faster, down to an 8ms floor.
# Default: 12
steps=12

# Volume ramp shape. auto (default) follows logarithmic_fade:
#   logarithmic_fade=yes → smooth
#   logarithmic_fade=no  → linear
# smooth: even loudness (decibel) ramp with soft corners. Default.
# linear: constant slope on the volume property.
# logarithmic: deeper decibel ramp (down to about -48 dB), also eased.
# Valid: auto, smooth, linear, logarithmic
fade_curve=auto

# Legacy switch used when fade_curve=auto.
# yes selects the smooth ease. no selects a linear ramp.
# The old parabola (steepest on the first step) is gone.
# Valid: yes, no
# Default: yes
logarithmic_fade=yes

# Picture ease across the same ramp as the audio.
# soft: brief dim, plus a gpu/gpu-next blur, strongest mid-fade.
# dim: contrast / saturation / brightness only (works on more VOs).
# blur: sharpen blur on gpu/gpu-next; other VOs fall back to dim.
# none: audio only.
# The settled pause is a clear frame unless video_hold=yes.
# Valid: soft, dim, blur, none
# Default: soft
video_transition=soft

# Leave the picture softened for the whole pause.
# Valid: yes, no
# Default: no
video_hold=no

# Peak blur, as a negative sharpen delta, on gpu and gpu-next.
# 0 disables the blur component. Valid: 0 - 100
# Default: 28
blur_strength=28

# Peak equalizer dip. Scales contrast, saturation, and brightness together.
# 0 disables the dim. Valid: 0 - 100
# Default: 22
dim_strength=22

# Seek back to the timestamp where the fade-out began.
# Off by default: unpause continues from the paused frame, and a seek made
# while paused is left alone. When on, that seek still wins if it moved
# time-pos by more than 0.25s from the paused frame.
# Valid: yes, no
# Default: no
restore_position=no

# Log ramp decisions to the mpv console (` key) and --msg-level.
# Valid: yes, no
# Default: no
debug_mode=no
